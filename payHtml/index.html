<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>储值卡充值跳转页</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg-start: #fbfdff;
      --page-bg-mid: #edf8ff;
      --page-bg-end: #f7fbff;
      --grid: rgba(16, 94, 128, 0.12);
      --surface: rgba(255, 255, 255, 0.82);
      --surface-solid: #fff;
      --surface-muted: rgba(237, 248, 255, 0.74);
      --line: rgba(55, 105, 145, 0.24);
      --line-strong: rgba(14, 116, 214, 0.42);
      --text-main: #132337;
      --text-sub: #496174;
      --text-soft: #718599;
      --primary: #0ea5e9;
      --secondary: #10b981;
      --primary-soft: rgba(14, 165, 233, 0.12);
      --button-text: #fff;
      --shadow: 0 18px 48px rgba(60, 90, 125, 0.10);
      --radius: 8px;
      --font-main: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    :root.dark {
      color-scheme: dark;
      --page-bg-start: #04070c;
      --page-bg-mid: #07111a;
      --page-bg-end: #0a1019;
      --grid: rgba(108, 240, 255, 0.13);
      --surface: rgba(10, 24, 38, 0.88);
      --surface-solid: #0a1826;
      --surface-muted: rgba(13, 32, 48, 0.76);
      --line: rgba(132, 245, 255, 0.28);
      --line-strong: rgba(137, 246, 255, 0.58);
      --text-main: #edfaff;
      --text-sub: #b8d8e3;
      --text-soft: #82a7b5;
      --primary: #89f6ff;
      --secondary: #52e2b7;
      --primary-soft: rgba(137, 246, 255, 0.14);
      --button-text: #031017;
      --shadow: 0 20px 58px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      color: var(--text-main);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(135deg, var(--page-bg-start), var(--page-bg-mid) 48%, var(--page-bg-end));
      background-size: 36px 36px, 36px 36px, auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 12px;
      pointer-events: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      opacity: 0.72;
    }

    .shell {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 28px;
    }

    .footer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 2px 16px;
      border-bottom: 1px solid var(--line);
    }

    .page-header__title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .page-header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .page-header .eyebrow { flex: 0 0 auto; }
    .page-header .hero-copy {
      margin: 0;
      max-width: 560px;
      text-align: right;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.05;
    }

    .hero-copy {
      max-width: 720px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.5;
    }

    .sections {
      display: grid;
      gap: 16px;
    }

    .section-panel,
    .product-section {
      --section-accent: var(--primary);
      --section-soft: var(--primary-soft);
      --section-border: var(--line-strong);
      --section-text: var(--primary);
    }

    .section-panel.theme-blue,
    .product-section.theme-blue {
      --section-accent: var(--primary);
      --section-soft: var(--primary-soft);
      --section-border: var(--line-strong);
      --section-text: var(--primary);
    }

    .section-panel.theme-emerald,
    .product-section.theme-emerald {
      --section-accent: var(--secondary);
      --section-soft: color-mix(in srgb, var(--secondary) 13%, transparent);
      --section-border: color-mix(in srgb, var(--secondary) 52%, transparent);
      --section-text: var(--secondary);
    }

    .section-panel.theme-rose,
    .product-section.theme-rose {
      --section-accent: #b692ff;
      --section-soft: rgba(182, 146, 255, 0.13);
      --section-border: rgba(182, 146, 255, 0.5);
      --section-text: #8b5cf6;
    }

    :root.dark .section-panel.theme-rose { --section-text: #c4a7ff; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--section-soft);
      border: 1px solid var(--section-border);
      color: var(--section-text);
      font-size: 12px;
      font-weight: 700;
    }

    .section-title {
      margin: 10px 0 0;
      font-size: 19px;
      line-height: 1.25;
    }

    .section-desc {
      max-width: 760px;
      margin: 8px 0 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
    }

    .section-count {
      align-self: flex-start;
      white-space: nowrap;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text-soft);
      font-size: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 0;
      height: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      background: var(--surface);
      box-shadow: var(--card-shadow);
      text-align: left;
      color: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover {
      border-color: var(--section-border);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.07);
    }

    .card:focus-visible {
      outline: 3px solid var(--section-border);
      outline-offset: 3px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--section-soft);
      color: var(--section-text);
      font-size: 12px;
      font-weight: 700;
    }

    .card-price {
      color: var(--section-accent);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .card-desc {
      flex: 1;
      margin: 0;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .card-meta {
      margin: 14px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--section-accent);
      font-weight: 700;
      font-size: 14px;
    }

    .card--channels { cursor: default; }

    .channel-list {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding-top: 14px;
    }

    .channel-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-muted);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .channel-button:hover:not(:disabled) {
      border-color: var(--section-border);
      background: var(--section-soft);
    }

    .channel-button:focus-visible {
      outline: 3px solid var(--section-border);
      outline-offset: 2px;
    }

    .channel-button:disabled {
      color: var(--text-soft);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .channel-copy { min-width: 0; }
    .channel-name { display: block; font-size: 13px; font-weight: 700; }
    .channel-note { display: block; margin-top: 2px; color: var(--text-soft); font-size: 12px; }
    .channel-arrow { flex: 0 0 auto; color: var(--section-accent); font-size: 16px; }

    .card > .channel-button { margin-top: auto; }

    .section-tabs {
      display: flex;
      gap: 6px;
      padding: 4px;
      margin-bottom: 12px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-muted);
    }

    .section-tab,
    .amount-tab {
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text-sub);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-tab {
      flex: 0 0 auto;
      padding: 9px 16px;
    }

    .section-tab[aria-selected="true"],
    .section-tab:hover {
      border-color: #cbd5e1;
      color: var(--text-main);
    }

    .section-tab[aria-selected="true"] {
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--button-text);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }

    .section-panel { padding: 2px 2px 0; }
    .section-panel[hidden] { display: none; }
    .amount-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }
    .amount-tab {
      min-width: 76px;
      padding: 8px 14px;
      border-color: var(--line);
      background: var(--surface-solid);
      color: var(--text-sub);
    }
    .amount-tab:hover { border-color: var(--section-accent); color: var(--section-text); }
    .amount-tab[aria-selected="true"] {
      border-color: var(--section-accent);
      background: var(--section-soft);
      color: var(--section-text);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--section-accent) 18%, transparent);
    }
    .payment-detail {
      padding: 4px 2px 0;
    }
    .payment-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .payment-title,
    .payment-desc,
    .payment-meta { display: block; }
    .payment-title { font-size: 17px; font-weight: 800; }
    .payment-desc { margin-top: 5px; color: var(--text-sub); font-size: 13px; }
    .payment-meta { margin-top: 4px; color: var(--text-soft); font-size: 12px; }
    .payment-price { color: var(--section-accent); font-size: 22px; white-space: nowrap; }
    .channel-heading {
      margin: 14px 0 8px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .channel-button {
      border-color: var(--line);
      background: var(--surface-muted);
      color: var(--text-main);
    }

    .footer {
      margin-top: 20px;
      padding: 18px 20px;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .empty {
      padding: 28px;
      border-radius: var(--card-radius);
      background: var(--surface);
      border: 1px dashed var(--line);
      color: var(--text-sub);
      text-align: center;
    }

    @media (max-width: 1024px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 1080px); padding-top: 16px; }
      .page-header {
        grid-template-columns: 1fr;
        display: block;
      }
      .page-header__title { display: flex; }
      .page-header .hero-copy { margin-top: 8px; text-align: left; }
      .section-heading { display: block; }
      .section-count { display: inline-flex; margin-top: 12px; }
      .cards { grid-template-columns: 1fr; }
      .card { padding: 13px; }
      .card-title { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div class="page-header__title">
        <span class="eyebrow" id="page-eyebrow">欢迎购买 iCode 兑换码</span>
        <h1 id="page-title">兑换码购买</h1>
      </div>
      <p id="page-subtitle" class="hero-copy"></p>
    </header>

    <div id="sections" class="sections" aria-label="兑换码购买板块"></div>

    <footer class="footer">
      <div id="page-hint"></div>
      <div id="page-footer"></div>
    </footer>
  </main>

  <script src="./config.js"></script>
  <script>
    applyPageTheme()
    const config = window.PAY_PAGE_CONFIG || {}
    const openMode = normalizeOpenMode(config.openMode)
    const sectionsContainer = document.getElementById('sections')

    document.getElementById('page-eyebrow').textContent = config.pageEyebrow || '欢迎购买 iCode 兑换码'
    document.getElementById('page-title').textContent = config.pageTitle || '储值卡充值'
    document.getElementById('page-subtitle').textContent =
      config.pageSubtitle || '请选择要跳转的储值卡页面。'
    document.getElementById('page-hint').textContent =
      config.pageHint || '下单前请确认套餐说明和到账规则。'
    document.getElementById('page-footer').textContent =
      config.footerText || '如支付后未及时到账，请保留订单信息并联系站点客服。'

    const sections = normalizeSections(config)
    if (sections.length === 0) {
      sectionsContainer.innerHTML = '<div class="empty">当前没有可用的充值卡，请先配置 payHtml/config.js。</div>'
    } else {
      renderSections(sections)
    }

    function applyPageTheme() {
      const params = new URLSearchParams(window.location.search)
      const requested = params.get('theme')
      const stored = localStorage.getItem('theme')
      const dark = requested === 'dark' || (!requested && (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)))
      document.documentElement.classList.toggle('dark', dark)
    }

    function normalizeSections(pageConfig) {
      const configuredSections = Array.isArray(pageConfig.sections) ? pageConfig.sections : []
      if (configuredSections.length > 0) {
        return configuredSections
          .map(function (section, index) { return normalizeSection(section, index) })
          .filter(function (section) { return !section.hidden })
      }

      const legacyItems = Array.isArray(pageConfig.items) ? pageConfig.items : []
      if (legacyItems.length === 0) return []
      return [normalizeSection({
        title: pageConfig.sectionTitle || '储值卡套餐',
        desc: pageConfig.sectionDesc || '选择适合当前需求的充值卡。',
        tag: pageConfig.sectionTag || '默认板块',
        theme: 'orange',
        items: legacyItems,
      }, 0)]
    }

    function normalizeSection(section, index) {
      const source = section && typeof section === 'object' ? section : {}
      return {
        title: textOr(source.title, `充值板块 ${index + 1}`),
        desc: textOr(source.desc || source.subtitle, ''),
        tag: textOr(source.tag || source.badge, ''),
        theme: normalizeTheme(source.theme, index),
        openMode: normalizeOpenMode(source.openMode || openMode),
        actionText: textOr(source.actionText, ''),
        emptyText: textOr(source.emptyText, '当前板块暂无可选套餐。'),
        hidden: source.hidden === true,
        items: Array.isArray(source.items) ? source.items : [],
      }
    }

    function renderSections(sectionList) {
      const tabs = document.createElement('div')
      tabs.className = 'section-tabs'
      tabs.setAttribute('role', 'tablist')
      const panels = document.createElement('div')
      panels.className = 'section-panels'
      sectionList.forEach(function (section, sectionIndex) {
        const tab = document.createElement('button')
        tab.type = 'button'
        tab.className = 'section-tab'
        tab.setAttribute('role', 'tab')
        tab.setAttribute('aria-selected', sectionIndex === 0 ? 'true' : 'false')
        tab.textContent = section.tag ? `${section.tag} · ${section.title}` : section.title
        const panel = renderSectionPanel(section, sectionIndex)
        tab.addEventListener('click', function () {
          Array.from(tabs.children).forEach(function (item) { item.setAttribute('aria-selected', 'false') })
          Array.from(panels.children).forEach(function (item) { item.hidden = true })
          tab.setAttribute('aria-selected', 'true')
          panel.hidden = false
        })
        tabs.appendChild(tab)
        panels.appendChild(panel)
      })
      sectionsContainer.appendChild(tabs)
      sectionsContainer.appendChild(panels)
    }

    function renderSectionPanel(section, sectionIndex) {
      const panel = document.createElement('section')
      panel.className = `section-panel ${section.theme}`
      panel.hidden = sectionIndex !== 0
      panel.innerHTML = [
        section.desc ? `<p class="section-desc">${escapeHtml(section.desc)}</p>` : '',
        '<div class="amount-tabs" role="tablist"></div>',
        '<div class="payment-detail"></div>',
      ].join('')
      const amountTabs = panel.querySelector('.amount-tabs')
      const detail = panel.querySelector('.payment-detail')
      if (section.items.length === 0) {
        detail.innerHTML = `<div class="empty">${escapeHtml(section.emptyText)}</div>`
        return panel
      }
      section.items.forEach(function (item, itemIndex) {
        const source = item && typeof item === 'object' ? item : {}
        const amountTab = document.createElement('button')
        amountTab.type = 'button'
        amountTab.className = 'amount-tab'
        amountTab.setAttribute('role', 'tab')
        amountTab.setAttribute('aria-selected', itemIndex === 0 ? 'true' : 'false')
        amountTab.textContent = textOr(source.price, textOr(source.tag, textOr(source.name, `选项 ${itemIndex + 1}`)))
        amountTab.addEventListener('click', function () {
          Array.from(amountTabs.children).forEach(function (tab) { tab.setAttribute('aria-selected', 'false') })
          amountTab.setAttribute('aria-selected', 'true')
          renderPaymentDetail(detail, source, itemIndex, section)
        })
        amountTabs.appendChild(amountTab)
        if (itemIndex === 0) renderPaymentDetail(detail, source, itemIndex, section)
      })
      return panel
    }

    function renderPaymentDetail(container, source, itemIndex, section) {
      const name = textOr(source.name, `未命名套餐 ${itemIndex + 1}`)
      const desc = textOr(source.desc, '请在配置文件中补充说明文字。')
      const price = textOr(source.price, '')
      const meta = textOr(source.meta, '')
      const actionText = textOr(source.actionText || section.actionText, '立即购买')
      const channels = normalizeChannels(source)
      container.innerHTML = [
        '<div class="payment-summary">',
        `<div><span class="payment-title">${escapeHtml(name)}</span>${desc ? `<span class="payment-desc">${escapeHtml(desc)}</span>` : ''}${meta ? `<span class="payment-meta">${escapeHtml(meta)}</span>` : ''}</div>`,
        price ? `<strong class="payment-price">${escapeHtml(price)}</strong>` : '',
        '</div>',
        '<div class="channel-heading">选择支付链路</div>',
        '<div class="channel-list"></div>',
      ].join('')
      const list = container.querySelector('.channel-list')
      list.setAttribute('aria-label', `${name}支付渠道`)
      channels.forEach(function (channel) {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'channel-button'
        button.disabled = !channel.url
        button.innerHTML = `<span class="channel-copy"><span class="channel-name">${escapeHtml(channel.name)}</span>${channel.note ? `<span class="channel-note">${escapeHtml(channel.note)}</span>` : ''}</span><span class="channel-arrow" aria-hidden="true">→</span>`
        button.addEventListener('click', function () {
          openTarget(channel.url, normalizeOpenMode(channel.openMode || source.openMode || section.openMode || openMode))
        })
        list.appendChild(button)
      })
      if (channels.length === 0) list.innerHTML = '<div class="empty">当前套餐未配置支付线路。</div>'
    }

    function normalizeChannels(source) {
      if (!Array.isArray(source.channels)) {
        return source.url ? [{ name: '立即购买', note: '', url: source.url, openMode: source.openMode }] : []
      }
      return source.channels
        .map(function (channel, index) {
          const item = channel && typeof channel === 'object' ? channel : {}
          return {
            name: textOr(item.name || item.title, `支付线路 ${index + 1}`),
            note: textOr(item.note || item.desc, ''),
            url: textOr(item.url, ''),
            openMode: item.openMode,
          }
        })
        .filter(function (channel) { return channel.name || channel.url })
    }

    function openTarget(url, mode) {
      const openers = {
        top: function () { return navigateWindow(window.top, url) },
        parent: function () { return navigateWindow(window.parent, url) },
        self: function () { return navigateWindow(window, url) },
        'new-tab': function () { return !!window.open(url, '_blank') },
      }

      if (openers[mode] && openers[mode]()) return
      if (navigateWindow(window.top, url)) return
      if (navigateWindow(window.parent, url)) return
      if (navigateWindow(window, url)) return
      window.open(url, '_blank')
    }

    function navigateWindow(targetWindow, url) {
      try {
        if (!targetWindow || !targetWindow.location) return false
        targetWindow.location.href = url
        return true
      } catch (error) {
        return false
      }
    }

    function normalizeOpenMode(mode) {
      return ['top', 'parent', 'self', 'new-tab'].indexOf(mode) >= 0 ? mode : 'top'
    }

    function normalizeTheme(theme, index) {
      const themes = ['orange', 'blue', 'emerald', 'rose']
      const value = String(theme || '').replace(/^theme-/, '')
      const normalized = themes.indexOf(value) >= 0 ? value : themes[index % themes.length]
      return `theme-${normalized}`
    }

    function textOr(value, fallback) {
      const text = value === undefined || value === null ? '' : String(value).trim()
      return text || fallback
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }
  </script>
</body>
