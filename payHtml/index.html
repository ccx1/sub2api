<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>储值卡充值跳转页</title>
  <style>
    :root {
      --page-bg: #f7f9fc;
      --surface: #fff;
      --surface-muted: #f8fafc;
      --line: #e2e8f0;
      --text-main: #111827;
      --text-sub: #475569;
      --text-soft: #64748b;
      --accent-soft: #fff7ed;
      --accent-text: #9a3412;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      --card-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
      --radius: 14px;
      --card-radius: 8px;
      --font-main: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      color: var(--text-main);
      background: linear-gradient(180deg, var(--page-bg) 0%, #eef4ff 46%, #fff 100%);
    }

    .shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .hero,
    .footer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
      padding: 32px;
      margin-bottom: 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
    }

    .hero-copy {
      max-width: 720px;
      color: var(--text-sub);
      font-size: 16px;
      line-height: 1.7;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      max-width: 340px;
    }

    .meta-chip {
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--surface-muted);
      border: 1px solid var(--line);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
    }

    .sections {
      display: grid;
      gap: 32px;
    }

    .product-section {
      --section-accent: #f97316;
      --section-soft: #fff7ed;
      --section-border: #fed7aa;
      --section-text: #9a3412;
    }

    .product-section.theme-blue {
      --section-accent: #2563eb;
      --section-soft: #eff6ff;
      --section-border: #bfdbfe;
      --section-text: #1e3a8a;
    }

    .product-section.theme-emerald {
      --section-accent: #059669;
      --section-soft: #ecfdf5;
      --section-border: #a7f3d0;
      --section-text: #064e3b;
    }

    .product-section.theme-rose {
      --section-accent: #e11d48;
      --section-soft: #fff1f2;
      --section-border: #fecdd3;
      --section-text: #9f1239;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--section-soft);
      border: 1px solid var(--section-border);
      color: var(--section-text);
      font-size: 12px;
      font-weight: 700;
    }

    .section-title {
      margin: 10px 0 0;
      font-size: 25px;
      line-height: 1.25;
    }

    .section-desc {
      max-width: 760px;
      margin: 8px 0 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .section-count {
      align-self: flex-start;
      white-space: nowrap;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text-soft);
      font-size: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 190px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      background: var(--surface);
      box-shadow: var(--card-shadow);
      text-align: left;
      color: inherit;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--section-border);
      background: linear-gradient(180deg, #fff, var(--section-soft));
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.10);
    }

    .card:focus-visible {
      outline: 3px solid var(--section-border);
      outline-offset: 3px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--section-soft);
      color: var(--section-text);
      font-size: 12px;
      font-weight: 700;
    }

    .card-price {
      color: var(--section-accent);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .card-desc {
      flex: 1;
      margin: 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
    }

    .card-meta {
      margin: 14px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--section-accent);
      font-weight: 700;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      padding: 18px 20px;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .empty {
      padding: 28px;
      border-radius: var(--card-radius);
      background: var(--surface);
      border: 1px dashed var(--line);
      color: var(--text-sub);
      text-align: center;
    }

    @media (max-width: 1024px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 24px, 1120px); padding-top: 24px; }
      .hero {
        grid-template-columns: 1fr;
        padding: 22px 20px;
      }
      .hero-meta { justify-content: flex-start; max-width: none; }
      .section-heading { display: block; }
      .section-count { display: inline-flex; margin-top: 12px; }
      .cards { grid-template-columns: 1fr; }
      .card { padding: 18px; }
      .card-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <span class="eyebrow" id="page-eyebrow">欢迎购买 iCode 兑换码</span>
        <h1 id="page-title">兑换码购买</h1>
        <p id="page-subtitle" class="hero-copy"></p>
      </div>
      <div class="hero-meta" id="hero-badges" aria-label="页面要点"></div>
    </section>

    <div id="sections" class="sections" aria-label="兑换码购买板块"></div>

    <footer class="footer">
      <div id="page-hint"></div>
      <div id="page-footer"></div>
    </footer>
  </main>

  <script src="./config.js"></script>
  <script>
    const config = window.PAY_PAGE_CONFIG || {}
    const openMode = normalizeOpenMode(config.openMode)
    const sectionsContainer = document.getElementById('sections')

    document.getElementById('page-eyebrow').textContent = config.pageEyebrow || '欢迎购买 iCode 兑换码'
    document.getElementById('page-title').textContent = config.pageTitle || '储值卡充值'
    document.getElementById('page-subtitle').textContent =
      config.pageSubtitle || '请选择要跳转的储值卡页面。'
    document.getElementById('page-hint').textContent =
      config.pageHint || '下单前请确认套餐说明和到账规则。'
    document.getElementById('page-footer').textContent =
      config.footerText || '如支付后未及时到账，请保留订单信息并联系站点客服。'

    renderHeroBadges(Array.isArray(config.heroBadges)
      ? config.heroBadges
      : ['多档可选', '购买后兑换', '移动端友好'])

    const sections = normalizeSections(config)
    if (sections.length === 0) {
      sectionsContainer.innerHTML = '<div class="empty">当前没有可用的充值卡，请先配置 payHtml/config.js。</div>'
    } else {
      const fragment = document.createDocumentFragment()
      sections.forEach(function (section, index) {
        fragment.appendChild(renderSection(section, index))
      })
      sectionsContainer.appendChild(fragment)
    }

    function renderHeroBadges(badges) {
      const badgesContainer = document.getElementById('hero-badges')
      const items = badges.filter(function (badge) { return String(badge || '').trim() })
      if (items.length === 0) {
        badgesContainer.hidden = true
        return
      }

      const fragment = document.createDocumentFragment()
      items.forEach(function (badge) {
        const chip = document.createElement('span')
        chip.className = 'meta-chip'
        chip.textContent = badge
        fragment.appendChild(chip)
      })
      badgesContainer.appendChild(fragment)
    }

    function normalizeSections(pageConfig) {
      const configuredSections = Array.isArray(pageConfig.sections) ? pageConfig.sections : []
      if (configuredSections.length > 0) {
        return configuredSections
          .map(function (section, index) { return normalizeSection(section, index) })
          .filter(function (section) { return !section.hidden })
      }

      const legacyItems = Array.isArray(pageConfig.items) ? pageConfig.items : []
      if (legacyItems.length === 0) return []
      return [normalizeSection({
        title: pageConfig.sectionTitle || '储值卡套餐',
        desc: pageConfig.sectionDesc || '选择适合当前需求的充值卡。',
        tag: pageConfig.sectionTag || '默认板块',
        theme: 'orange',
        items: legacyItems,
      }, 0)]
    }

    function normalizeSection(section, index) {
      const source = section && typeof section === 'object' ? section : {}
      return {
        title: textOr(source.title, `充值板块 ${index + 1}`),
        desc: textOr(source.desc || source.subtitle, ''),
        tag: textOr(source.tag || source.badge, ''),
        theme: normalizeTheme(source.theme, index),
        openMode: normalizeOpenMode(source.openMode || openMode),
        actionText: textOr(source.actionText, ''),
        emptyText: textOr(source.emptyText, '当前板块暂无可选套餐。'),
        hidden: source.hidden === true,
        items: Array.isArray(source.items) ? source.items : [],
      }
    }

    function renderSection(section, sectionIndex) {
      const sectionElement = document.createElement('section')
      const titleId = `pay-section-${sectionIndex + 1}`
      sectionElement.className = `product-section ${section.theme}`
      sectionElement.setAttribute('aria-labelledby', titleId)
      sectionElement.innerHTML = [
        '<div class="section-heading">',
        '<div>',
        section.tag ? `<span class="section-kicker">${escapeHtml(section.tag)}</span>` : '',
        `<h2 class="section-title" id="${titleId}">${escapeHtml(section.title)}</h2>`,
        section.desc ? `<p class="section-desc">${escapeHtml(section.desc)}</p>` : '',
        '</div>',
        `<span class="section-count">${section.items.length} 个选项</span>`,
        '</div>',
        '<div class="cards"></div>',
      ].join('')

      const cardsElement = sectionElement.querySelector('.cards')
      if (section.items.length === 0) {
        cardsElement.innerHTML = `<div class="empty">${escapeHtml(section.emptyText)}</div>`
        return sectionElement
      }

      section.items.forEach(function (item, itemIndex) {
        cardsElement.appendChild(renderCard(item, itemIndex, section))
      })
      return sectionElement
    }

    function renderCard(item, itemIndex, section) {
      const source = item && typeof item === 'object' ? item : {}
      const name = textOr(source.name, `未命名套餐 ${itemIndex + 1}`)
      const desc = textOr(source.desc, '请在配置文件中补充说明文字。')
      const tag = textOr(source.tag, `选项 ${itemIndex + 1}`)
      const price = textOr(source.price, '')
      const meta = textOr(source.meta, '')
      const actionText = textOr(source.actionText || section.actionText, '立即购买')
      const button = document.createElement('button')
      button.type = 'button'
      button.className = 'card'
      button.setAttribute('aria-label', `${name}，${actionText}`)
      button.innerHTML = [
        '<div class="card-top">',
        `<span class="card-tag">${escapeHtml(tag)}</span>`,
        price ? `<span class="card-price">${escapeHtml(price)}</span>` : '',
        '</div>',
        `<h3 class="card-title">${escapeHtml(name)}</h3>`,
        `<p class="card-desc">${escapeHtml(desc)}</p>`,
        meta ? `<p class="card-meta">${escapeHtml(meta)}</p>` : '',
        `<div class="card-action"><span>${escapeHtml(actionText)}</span><span aria-hidden="true">→</span></div>`,
      ].join('')
      button.addEventListener('click', function () {
        if (!source.url) {
          window.alert('当前卡片未配置跳转地址，请先修改 payHtml/config.js。')
          return
        }
        openTarget(source.url, normalizeOpenMode(source.openMode || section.openMode || openMode))
      })
      return button
    }

    function openTarget(url, mode) {
      const openers = {
        top: function () { return navigateWindow(window.top, url) },
        parent: function () { return navigateWindow(window.parent, url) },
        self: function () { return navigateWindow(window, url) },
        'new-tab': function () { return !!window.open(url, '_blank') },
      }

      if (openers[mode] && openers[mode]()) return
      if (navigateWindow(window.top, url)) return
      if (navigateWindow(window.parent, url)) return
      if (navigateWindow(window, url)) return
      window.open(url, '_blank')
    }

    function navigateWindow(targetWindow, url) {
      try {
        if (!targetWindow || !targetWindow.location) return false
        targetWindow.location.href = url
        return true
      } catch (error) {
        return false
      }
    }

    function normalizeOpenMode(mode) {
      return ['top', 'parent', 'self', 'new-tab'].indexOf(mode) >= 0 ? mode : 'top'
    }

    function normalizeTheme(theme, index) {
      const themes = ['orange', 'blue', 'emerald', 'rose']
      const value = String(theme || '').replace(/^theme-/, '')
      const normalized = themes.indexOf(value) >= 0 ? value : themes[index % themes.length]
      return `theme-${normalized}`
    }

    function textOr(value, fallback) {
      const text = value === undefined || value === null ? '' : String(value).trim()
      return text || fallback
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }
  </script>
</body>
</html>
