# Nginx example: make public /login and /register render the static homepage,
# while a hidden gate can still end at the original /login or /register URL.
#
# Replace every CHANGE_ME_* value before deploying.
# Put the map/upstream blocks in the nginx http {} block.
# Put the server/location blocks in the matching server {} block.

map $cookie_sub2api_auth_gate $sub2api_gate_cookie_ok {
    default 0;
    "CHANGE_ME_COOKIE_VALUE" 1;
}

map $arg_next $sub2api_gate_next {
    default /login;
    login /login;
    /login /login;
    register /register;
    /register /register;
}

upstream sub2api_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

