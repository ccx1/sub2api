<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex JSON 转 sub2api 导入</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">sub2api tools</p>
        <h1>Codex JSON 转导入包</h1>
      </div>
      <div class="summary-strip" aria-live="polite">
        <span><strong id="fileCount">0</strong> 文件</span>
        <span><strong id="accountCount">0</strong> 账号</span>
        <span><strong id="errorCount">0</strong> 问题</span>
      </div>
    </header>

    <section class="workspace" aria-label="转换工作区">
      <section class="tool-pane input-pane">
        <div id="dropZone" class="drop-zone" tabindex="0">
          <input id="fileInput" class="sr-only" type="file" accept=".json,application/json" multiple>
          <input id="folderInput" class="sr-only" type="file" accept=".json,application/json" webkitdirectory directory multiple>
          <div class="pick-row">
            <button id="pickFiles" class="icon-button primary" type="button">
              <span aria-hidden="true">+</span>
              <span>选择 JSON</span>
            </button>
            <button id="pickFolder" class="icon-button" type="button">
              <span aria-hidden="true">▦</span>
              <span>选择文件夹</span>
            </button>
          </div>
          <p>也可以拖入多个 JSON 文件</p>
        </div>

        <form class="settings-grid" aria-label="导入设置">
          <label>
            <span>账号名前缀</span>
            <input id="namePrefix" type="text" placeholder="可留空">
          </label>
          <label>
            <span>备注</span>
            <input id="notes" type="text" placeholder="可留空">
          </label>
          <label>
            <span>并发数</span>
            <input id="concurrency" type="number" min="0" value="3">
          </label>
          <label>
            <span>优先级</span>
            <input id="priority" type="number" min="0" value="50">
          </label>
          <label>
            <span>去重</span>
            <select id="dedupe">
              <option value="email">按邮箱</option>
              <option value="file">按文件名</option>
              <option value="none">不去重</option>
            </select>
          </label>
          <label>
            <span>输出格式</span>
            <select id="outputMode">
              <option value="bundle">完整导入包</option>
              <option value="accounts">仅账号数组</option>
            </select>
          </label>
        </form>

        <div class="action-row">
          <button id="downloadBtn" class="icon-button primary" type="button" disabled>
            <span aria-hidden="true">v</span>
            <span>下载 JSON</span>
          </button>
          <button id="copyBtn" class="icon-button" type="button" disabled>
            <span aria-hidden="true">[]</span>
            <span>复制</span>
          </button>
          <button id="clearBtn" class="icon-button danger" type="button" disabled>
            <span aria-hidden="true">x</span>
            <span>清空</span>
          </button>
        </div>

        <p id="statusLine" class="status-line" aria-live="polite">等待文件</p>
      </section>

      <section class="tool-pane table-pane">
        <div class="pane-heading">
          <h2>文件预览</h2>
          <span id="validBadge" class="badge muted">未生成</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>状态</th>
                <th>账号名</th>
                <th>邮箱</th>
                <th>来源</th>
              </tr>
            </thead>
            <tbody id="fileRows">
              <tr>
                <td colspan="4" class="empty-cell">暂无文件</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="tool-pane preview-pane">
        <div class="pane-heading">
          <h2>JSON 预览</h2>
          <span id="sizeBadge" class="badge muted">0 KB</span>
        </div>
        <pre id="jsonPreview" aria-label="生成的 JSON 预览">{}</pre>
      </section>
    </section>
  </main>

  <script src="./converter-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
